    <title>NEAT Therapy Dogs</title>

  <body>
    <style>
      * {
        margin: 0px;
        padding: 10px;
        box-sizing: border-box;
      }

      body {
        background-color: #19193c;
        font-family: sans-serif;
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: 0;
        margin: 0;
      }

      h2 {
        text-align: center;
        font-family: sans-serif;
        font-size: 32px;
        color: #6ab9c9;
      }

      canvas {
        display: block;
        margin: 5px auto;
      }

      #gameInfo {
        color: #eeeefd;
        font-size: 25px;
        background-color: #29284d;
        border-top: 2px solid #57327c;
        padding-top: 15px;
        padding-left: 30px;
        line-height: 1.5;
        height: 180;
        width: 400;
        text-align: left;
        font-family: monospace;
      }

      #controlsInfo {
        color: #eeeefd;
        font-size: 20px;
        background-color: #29284d;
        border-top: 2px solid #57327c;
        height: 180;
        width: 400;
        text-align: left;
        font-family: monospace;
        line-height: 5px;
      }

      .container {
        display: flex;
        justify-content: center;
        align-items: flex-start;
        gap: 20px;
        flex-wrap: wrap;
        margin-bottom: 20px;
      }

      .accordion {
        text-align: center;
        font-family: sans-serif;
        font-size: 25px;
        color: #6ab9c9;
        background-color: #57327c;
        cursor: pointer;
        padding: 10px;
        width: 100%;
        border: none;
        outline: none;
        transition: 0.4s;
        margin-bottom: 20px;
      }

      .accordion.selected {
        outline: 3px solid #4cff4c;
      }

      .accordion:hover {
        background-color: #8264a0;
      }

      .panel {
        color: #eeeefd;
        font-size: 20px;
        background-color: #29284d;
        padding: 10px;
        width: fit-content;
        text-align: left;
        font-family: monospace;
        display: none;
        overflow: hidden;
        margin-top: -20px;
        margin-bottom: 20px;
      }

      .brain-heading {
        display: flex;
        flex-direction: row;
        justify-content: space-between;
        align-items: center;
      }

      h2.brain-h2 {
        font-size: 1.2rem;
      }

      span.brain-gen,
      .legend-item {
        font-size: 1.2rem;
        font-weight: bold;
        color: #6ab9c9;
      }

      span.dot {
        display: flex;
        height: 20px;
        width: 20px;
        flex-direction: row;
        border-radius: 12px;
        margin-right: 10px;
      }

      span.legend-item {
        display: flex;
        flex-direction: row;
      }

      .brain-legend {
        display: flex;
        flex-direction: row;
      }

      html,
      main {
        padding: 0;
      }

    </style>
    <main>
      <div id="canvasContainer"></div>
      <div class="container">
        <div id="gameInfo"></div>
        <div id="controlsInfo">
          <h3>Controls</h3>
          <p>
            <b>Start:</b>
            &emsp;&emsp;&emsp;&emsp;&emsp;&emsp;&emsp;&emsp;&emsp;Play the game!
          </p>
          <p>
            <b>A:</b>
            &emsp;&emsp;&emsp;&emsp;&emsp;&emsp;&emsp;&emsp;&emsp;&emsp;&emsp;&emsp;&emsp;Sprint
          </p>
          <p><b>Left Stick:</b> &emsp;&emsp;&emsp;&emsp;Move</p>
          <p><b>Right Stick:</b> &emsp;&emsp;&emsp;Navigate Info</p>
          <p>
            <b>B:</b>
            &emsp;&emsp;&emsp;&emsp;&emsp;&emsp;&emsp;&emsp;&emsp;&emsp;&emsp;&emsp;&emsp;Select
            Info
          </p>
        </div>
      </div>

      <div class="brain-container">
        <div class="brain-heading">
          <h2 class="brain-h2">Best Genome</h2>
          <span class="brain-gen">Generation 4</span>
        </div>
        <div class="brain-canvas">
          <canvas id="brain" width="1080" height="700"></canvas>
        </div>
        <div class="brain-legend">
          <span class="legend-item"
            ><span
              class="dot"
              style="background-color: rgb(111, 143, 169)"
            ></span
            >Input</span
          ><span class="legend-item"
            ><span
              class="dot"
              style="background-color: rgb(127, 161, 111)"
            ></span
            >Hidden</span
          ><span class="legend-item"
            ><span
              class="dot"
              style="background-color: rgb(217, 119, 87)"
            ></span
            >Output</span
          ><span class="legend-item"
            ><span class="dot" style="background-color: rgb(188, 75, 60)"></span
            >Bias</span
          >
        </div>
      </div>
    </main>
  </body>
